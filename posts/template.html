<!DOCTYPE html>
<html lang="en">

<!--
  HOW TO USE THIS TEMPLATE
  ========================

  1. COPY this file and rename it (e.g. "spectral-circuits-notes.html")

  2. FILL IN the fields below marked with [BRACKETS]

  3. ADD an entry to posts.json:
     {
       "id": "your-post-id",
       "title": "Your Post Title",
       "date": "2026-06-01",
       "type": "original",          <-- or "repost"
       "excerpt": "One sentence summary shown on the listing page.",
       "url": "posts/your-post-id.html",
       "tags": ["interpretability", "notes"]
     }

  FOR A REPOST, also add:
       "source": "Alignment Forum",
       "source_url": "https://..."

  Tags to consider:
    interpretability, alignment, safety, hallucination, spectral, notes,
    repost, publication, meta, tools
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="[POST TITLE] — Valentin Noël">
    <title>[POST TITLE] · Valentin Noël</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #f9f7f4;
            --text: #1c1917;
            --text-mid: #44403c;
            --text-muted: #78716c;
            --accent: #92400e;
            --link: #92400e;
            --link-hover: #78350f;
            --border: #e7dfd5;
            --max-width: 660px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }

        nav {
            position: sticky;
            top: 0;
            background: rgba(249, 247, 244, 0.96);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            padding: 0 2rem;
        }

        .nav-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 3.5rem;
        }

        .nav-brand {
            font-family: 'EB Garamond', serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text);
            text-decoration: none;
        }

        .back-link { font-size: 0.85rem; color: var(--text-muted); text-decoration: none; }
        .back-link:hover { color: var(--accent); }

        article {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 3.5rem 2rem 6rem;
        }

        .post-meta {
            font-size: 0.825rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .post-tag {
            padding: 0.12rem 0.5rem;
            background: #fef3c7;
            color: #92400e;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        /* For reposts: show source attribution */
        .repost-banner {
            padding: 0.85rem 1.1rem;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .repost-banner a { color: var(--link); }

        h1 {
            font-family: 'EB Garamond', serif;
            font-size: 2.1rem;
            font-weight: 500;
            line-height: 1.2;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }

        .post-body { font-size: 1rem; line-height: 1.85; color: var(--text-mid); }
        .post-body p + p { margin-top: 1.1rem; }

        .post-body h2 {
            font-family: 'EB Garamond', serif;
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--text);
            margin: 2rem 0 0.75rem;
        }

        .post-body h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin: 1.5rem 0 0.5rem;
        }

        .post-body a { color: var(--link); }
        .post-body a:hover { color: var(--link-hover); }
        .post-body em { font-style: italic; }
        .post-body strong { font-weight: 600; color: var(--text); }

        .post-body ul, .post-body ol {
            padding-left: 1.4rem;
            margin: 0.75rem 0;
        }

        .post-body li { margin-bottom: 0.3rem; }

        .post-body blockquote {
            border-left: 3px solid var(--border);
            padding-left: 1.2rem;
            color: var(--text-muted);
            font-style: italic;
            margin: 1.25rem 0;
        }

        .post-body code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875em;
            background: #f0ebe3;
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
            color: var(--text);
        }

        .post-body pre {
            background: #f0ebe3;
            border-radius: 6px;
            padding: 1rem 1.2rem;
            overflow-x: auto;
            margin: 1.25rem 0;
        }

        .post-body pre code {
            background: none;
            padding: 0;
            font-size: 0.85rem;
        }

        footer {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        footer a { color: var(--link); text-decoration: none; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>

<body>
    <nav>
        <div class="nav-inner">
            <a href="../" class="nav-brand">Valentin Noël</a>
            <a href="./" class="back-link">← All posts</a>
        </div>
    </nav>

    <article>
        <h1>[POST TITLE]</h1>
        <div class="post-meta">
            <span>[DATE e.g. 1 Jun 2026]</span>
            <span class="post-tag">[tag]</span>
            <!-- Add more tags: <span class="post-tag">another-tag</span> -->
        </div>

        <!-- ONLY FOR REPOSTS: show where this originally appeared -->
        <!--
        <div class="repost-banner">
            Originally published on <a href="[SOURCE URL]" target="_blank">[SOURCE NAME]</a>.
            Notes below are my own.
        </div>
        -->

        <div class="post-body">
            <p>
                [Write your post content here. Each paragraph is a &lt;p&gt; tag.]
            </p>

            <h2>[Section heading]</h2>

            <p>
                [More content...]
            </p>

            <ul>
                <li>[List item]</li>
                <li>[List item]</li>
            </ul>

            <blockquote>
                [A quote or key point worth emphasizing.]
            </blockquote>
        </div>
    </article>

    <footer>
        <span>© 2026 Valentin Noël</span>
        <a href="./">← All posts</a>
    </footer>
</body>

</html>
